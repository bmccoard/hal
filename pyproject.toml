[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neo-agent-cli"
version = "0.1.0"
description = "A Python port of the Neo coding-agent CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
neo = "neo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/neo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

