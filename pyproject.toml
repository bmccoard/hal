[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hal-agent-cli"
version = "0.4"
description = "HAL, a local provider-neutral coding-agent CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
hal = "hal.cli:main"

[project.optional-dependencies]
tui = [
  "rich>=14.2,<16",
  "textual>=7.5,<8",
]
git = [
  "dulwich>=0.24,<0.26",
]
documents = [
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "reportlab>=4,<5",
]
dev = [
  "pytest>=8.0",
  "dulwich>=0.24,<0.26",
  "rich>=14.2,<16",
  "textual>=7.5,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
