[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hal-simple"
version = "0.1.0"
description = "A simple tool extension for HAL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "hal-agent-cli",
]

[project.entry-points."hal.tools"]
simple = "hal_simple:create_tools"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hal-agent-cli[dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hal_simple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
